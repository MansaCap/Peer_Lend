#pyproject.toml

[tool.poetry]
name = "peer_lend"
version = "0.1.0"
description = "Pulse Lending demo app with Streamlit borrower scoring"
authors = ["BentleyBot <winstonwilliamsiii@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
streamlit = "^1.35.0"
pandas = "^2.2.2"
numpy = "^1.26.4"
fastapi = "^0.111.0"
pydantic = "^2.7.1"

[tool.poetry.dev-dependencies]
pytest = "^8.2.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

